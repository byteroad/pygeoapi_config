name: Build and Attach Plugin ZIP to Release (Windows)

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package-and-upload:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pb_tool
        run: |
          pip install pb_tool==3.1.0

      - name: Run pb_tool zip
        run: |
          pb_tool zip

      - name: Remove .buildinfo from the built zip
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zipPath = (Resolve-Path "zip_build\*.zip").Path
          $zip = [System.IO.Compression.ZipFile]::Open($zipPath, 'Update')
          $entry = $zip.Entries | Where-Object { $_.FullName -eq 'pygeoapi_config/help/.buildinfo' }
          if ($entry) {
            $entry.Delete()
            Write-Host "Removed $($entry.FullName) from $zipPath"
          } else {
            Write-Host "No .buildinfo entry found in zip"
          }
          $zip.Dispose()

      - name: Copy zip file to staging directory
        run: |
          New-Item -ItemType Directory -Path build -Force
          Copy-Item zip_build\*.zip build\

      - name: Upload ZIP to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}